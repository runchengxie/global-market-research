name: Paper Gateway launcher

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - name: Install locked test dependencies
        run: uv sync --locked --extra test --extra ibkr
      - name: Check launcher source
        run: uv run --locked ruff check src/competition_tools/gateway_launcher.py src/competition_tools/check_native_process_delivery.py tests/competition_tools/test_gateway_launcher.py tests/operations/test_gateway_powershell.py tests/operations/test_native_process_diagnostics.py
      - name: Run offline Python and native PowerShell tests
        run: uv run --locked pytest -q tests/competition_tools/test_gateway_launcher.py tests/operations/test_gateway_powershell.py tests/operations/test_native_process_diagnostics.py
